<!Doctype html>
<html>
<head>
<title> Library membership</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1> Library membership Form</h1>
<form id="Library">
<label>Name:</label>
<input type="text" id="name" required>
<br><br>

<label>Age:</label>
<input type="number" id="age" required>
<br><br>

<label>Email:</label>
<input type="email" id="email" required>
<br><br> 

<label>Phone:</label>
<input type="number" id="Phone" required>
<br><br>

<label>Membership type:</label>
<input type="radio" name="Category" id="membership" value="Basic" checked> Basic
<input type="radio"  name="Category" id="membership" value="Silver">Silver
<input type="radio" name="Category" id="membership" value="Gold">Gold
<br><br>

<input type="submit" value="Register"> 
</form>
<hr>
<div id="output"></div>
<script src="script.js"></script>
</body>
</html>

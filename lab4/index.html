<!DOCTYPE html>
<html>

<head>
    <title>City Gym Membership</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>City Gym Membership</h1>
    </header>
    <main>
        <table>
            <tr>
                <th>Item</th>
                <th>Fee (Taka)</th>
            </tr>
            <tr>
                <td>Monthly Plan</td>
                <td>1500</td>
            </tr>
            <tr>
                <td>Quarterly Plan</td>
                <td>4000</td>
            </tr>
            <tr>
                <td>Yearly Plan</td>
                <td>14000</td>
            </tr>
            <tr>
                <td>Family Add-on (each)</td>
                <td>500</td>
            </tr>
        </table>

        <form id="gymForm" onsubmit="return validateForm()" novalidate>
            <fieldset>
                <legend>Personal Details</legend>

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName">
                <div class="error" id="nameError"></div>

                <label for="age">Age</label>
                <input type="number" id="age">
                <div class="error" id="ageError"></div>

                <label for="mobile">Mobile Number</label>
                <input type="text" id="mobile">
                <div class="error" id="mobileError"></div>

                <label for="email">Email</label>
                <input type="text" id="email">
                <div class="error" id="emailError"></div>

                <label for="password">Password</label>
                <input type="password" id="password">
                <div class="error" id="passwordError"></div>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword">
                <div class="error" id="confirmError"></div>
            </fieldset>
            <fieldset>
                <legend>Membership Plan</legend>
                <label for="plan">Select Plan</label>
                <select id="plan">
                    <option value="">Chose one</option>
                    <option value="Monthly">Monthly</option>
                    <option value="Quarterly">Quarterly</option>
                    <option value="Yearly">Yearly</option>
                </select>
                <div class="error" id="planError"></div>

                <label for="startDate">Start Date</label>
                <input type="date" id="startDate">
                <div class="error" id="dateError"></div>

                <p>Workout Time</p>
                <input type="radio" id="morning" name="workoutTime" value="Morning">
                <label for="morning" class="radio-label">Morning</label>
                <input type="radio" id="afternoon" name="workoutTime" value="Afternoon">
                <label for="afternoon" class="radio-label">Afternoon</label>
                <input type="radio" id="evening" name="workoutTime" value="Evening">
                <label for="evening" class="radio-label">Evening</label>
                <div class="error" id="timeError"></div>

                <div class="trainer">
                    <label for="mainTrainer">Main Trainer</label>
                    <select id="mainTrainer">
                        <option value="">Select Trainer</option>
                        <option value="Rafi">Rafi</option>
                        <option value="Mitu">Mitu</option>
                        <option value="Sabbir">Sabbir</option>
                        <option value="Joya">Joya</option>
                    </select>
                    <div class="error" id="mainError"></div>
                </div>

                <div class="trainer">
                    <label for="backupTrainer">Backup Trainer</label>
                    <select id="backupTrainer">
                        <option value="">Select Trainer</option>
                        <option value="Rafi">Rafi</option>
                        <option value="Mitu">Mitu</option>
                        <option value="Sabbir">Sabbir</option>
                        <option value="Joya">Joya</option>
                    </select>
                    <div class="error" id="backupError"></div>
                </div>

                <label for="addons">Family Add-ons</label>
                <input type="number" id="addons">
                <div class="error" id="addonsError"></div>
            </fieldset>

            <input type="checkbox" id="agree" onchange="toggleButton()">
            <label for="agree">I am medically fit to exercise and I accept the gym rules.</label>
            <br>
            <button type="submit" id="joinBtn" disabled>Join Now</button>
            <div id="finalMessage"></div>
        </form>
    </main>
    <footer><h5>See you soon...</h5></footer>
    <script src="script.js"></script>
</body>

</html>
